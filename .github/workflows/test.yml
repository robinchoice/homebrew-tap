name: Test

# Installs the cask from main the way users do, then checks the app's signature and audits the cask.
# Runs on every push to main and after each bump.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - run: brew install --cask robinchoice/tap/savor
      - run: codesign --verify --deep --strict /Applications/Savor.app && spctl --assess --type execute /Applications/Savor.app
      - run: brew trust robinchoice/tap && brew audit --cask --online --strict robinchoice/tap/savor
      - run: brew uninstall --cask robinchoice/tap/savor
